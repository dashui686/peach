name: 回收 v0.63.0 macOS 对应源码
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            key: macos-media-v2-arm64-621559eaa6d510dd2fe6f3acb3b9d70ba065ec1bfb5fbe2b401bfb702def94db
          - arch: x86_64
            runner: macos-15-intel
            key: macos-media-v2-x86_64-6e5a6751930211c8461c4f6f158cd1c85fa42ed27a5159c22b5063afabaf4736
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ matrix.key }}
          path: build/media-cache/macos-${{ matrix.arch }}
          fail-on-cache-miss: true
      - name: 对照原版 DMG 内的媒体清单核验源码摘要
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build/dmg build/export "$RUNNER_TEMP/Peach-install"
          gh release download v0.63.0 --pattern "Peach-0.63.0-macos-$ARCH.dmg" --dir build/dmg
          mount="$RUNNER_TEMP/Peach-install"
          hdiutil attach "build/dmg/Peach-0.63.0-macos-$ARCH.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/Peach.app"
          for tool in ffmpeg untrunc; do
            name="$tool-macos-$ARCH-corresponding-source.zip"
            cp "build/media-cache/macos-$ARCH/$tool/$name" "build/export/$name"
            python3 - "$mount/Peach.app/Contents/Resources/tools/$tool/manifest.json" "build/export/$name" "$ARCH" <<'PY'
          from hashlib import file_digest
          import json
          from pathlib import Path
          import sys
          manifest_path, archive_path = map(Path, sys.argv[1:3])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          with archive_path.open("rb") as archive:
              actual = file_digest(archive, "sha256").hexdigest()
          assert manifest["architecture"] == sys.argv[3], manifest["architecture"]
          assert manifest["source_archive"] == {"name": archive_path.name, "sha256": actual}
          print(actual, archive_path.name)
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v0.63.0-macos-source-${{ matrix.arch }}
          path: build/export/*.zip
          if-no-files-found: error
          retention-days: 7
